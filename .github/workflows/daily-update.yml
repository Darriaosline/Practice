name: Daily Repository Update

on:
  schedule:
    - cron: '30 7 * * *'   # Runs daily at 07:30 UTC
  workflow_dispatch:       # allows manual trigger

jobs:
  update-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Git
        run: |
          git config user.name "DevSync Bot"
          git config user.email "22f1000310@ds.study.iitm.ac.in"

      - name: Daily Commit Step - 22f1000310@ds.study.iitm.ac.in
        run: |
          echo "Update time: $(date)" >> daily_log.txt
          git add daily_log.txt
          git commit -m "Daily automated update $(date)"
          git push
